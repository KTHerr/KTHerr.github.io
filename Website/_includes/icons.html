{% comment %}
  The hero centerpiece: a circular (radial) phylogenetic tree whose six tips
  are the site's sections — the nav, reimagined as a cladogram. Research and
  Publications are drawn as the very last split (a cherry, sister branches) so
  the tree itself tells the story: publications come out of research. This SVG
  draws only the decorative branches (currentColor); the clickable tip labels
  are real HTML links laid on top by home.html, positioned with the matching
  percentages computed alongside this tree. Root at the portrait (center).
{% endcomment %}
{% capture hero_phylogeny %}<svg class="hero-tree" viewBox="-238 -238 476 476" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <g stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
    <!-- radial branches; the root emerges from behind the portrait -->
    <path d="M61.49 35.50L72.75 42.00M72.75 42.00L94.69 54.67M54.67 -94.69L80.00 -138.56M-54.67 94.69L-67.33 116.62M67.33 116.62L80.00 138.56M-134.67 0.00L-160.00 0.00"/>
    <!-- node arcs -->
    <path d="M94.69 54.67A109.33 109.33 0 0 0 54.67 -94.69M94.69 54.67A109.33 109.33 0 0 1 -54.67 94.69M80.00 -138.56A160 160 0 0 0 0.00 -160.00M80.00 -138.56A160 160 0 0 1 138.56 -80.00M-67.33 116.62A134.67 134.67 0 0 0 67.33 116.62M-67.33 116.62A134.67 134.67 0 0 1 -134.67 0.00M80.00 138.56A160 160 0 0 0 138.56 80.00M80.00 138.56A160 160 0 0 1 0.00 160.00M-160.00 0.00A160 160 0 0 0 -138.56 80.00M-160.00 0.00A160 160 0 0 1 -138.56 -80.00"/>
  </g>
  <!-- branch points -->
  <g fill="currentColor">
    <circle cx="72.75" cy="42.00" r="4"/>
    <circle cx="54.67" cy="-94.69" r="3.4"/>
    <circle cx="-54.67" cy="94.69" r="3.4"/>
    <circle cx="67.33" cy="116.62" r="3.4"/>
    <circle cx="-134.67" cy="0.00" r="3.4"/>
  </g>
</svg>{% endcapture %}
