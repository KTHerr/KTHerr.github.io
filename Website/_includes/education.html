<ol class="timeline">
  {% for entry in site.data.education %}
    <li class="timeline-item">
      <span class="timeline-icon"><img src="{{ entry.Icon | relative_url }}" alt="{{ entry.School }} crest" loading="lazy"></span>
      <div class="timeline-body">
        <div class="dates">{{ entry["Start Date"] }}{% if entry["End Date"] %} – {{ entry["End Date"] }}{% endif %}</div>
        <h3>{{ entry.School }}</h3>
        <p class="program">{{ entry.Program }}</p>
        {% if entry.Detail %}<p>{{ entry.Detail }}</p>{% endif %}
      </div>
    </li>
  {% endfor %}
</ol>
