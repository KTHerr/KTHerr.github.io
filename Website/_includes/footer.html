<footer class="site-footer">
  <div class="container footer-row">
    <div>
      <strong style="color:#fff;">{{ site.title }}</strong>
      <div class="footer-note">{{ site.occupation }}</div>
      <div class="footer-note">{{ icon_pin }} {{ site.location }}</div>
    </div>
    <div class="footer-social">
      {% include social.html %}
    </div>
  </div>
  <div class="container footer-meta">
    <div class="footer-note">&copy; {{ site.time | date: '%Y' }} {{ site.author }}.</div>
    {% if site.repository %}
      <a class="footer-note repo-link" href="https://github.com/{{ site.repository }}" target="_blank" rel="noopener">
        {{ icon_github }} Source on GitHub
      </a>
    {% endif %}
  </div>
</footer>
