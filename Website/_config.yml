# =======================================#
# -----------SITE SETTINGS---------------#
#========================================#

title: Kathryn Herr
description: Researcher in insect–microbe symbiosis, based in Bath, UK. Host–microbe symbiosis, evolutionary biology, microbiology, entomology and bioinformatics, alongside undergraduate teaching and mentoring.
baseurl:
url: "https://kathryn-biology.com" # deployed URL — used for absolute links in social-share meta tags
image: /assets/images/herr_katie.jpeg
image_alt: Portrait of Kathryn Herr

author: Kathryn Herr
profile_image: /assets/images/herr_katie.jpeg
occupation: Researcher in insect–microbe symbiosis
location: Bath, UK
# The address is split here on purpose: nothing in the built HTML ever contains
# the full string, so scrapers scanning for user@host come up empty. See
# _includes/email-link.html.
email_user: kathryn
email_domain: kathryn-biology.com
linkedin: kathryn-herr-a516a4a7
repository: KTHerr/KTHerr.github.io
orcid: 0000-0001-9647-5104

# =======================================#
# -----------BUILD SETTINGS--------------#
#========================================#
theme:
markdown: kramdown

kramdown:
  syntax_highlighter: rouge

plugins:
  - jekyll-scholar

exclude:
  - netlify.toml   # unused: the site deploys via GitHub Pages
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# =======================================#
# -----JEKYLL SCHOLAR SETTINGS-----------#
#========================================#
scholar:
  last_name: Herr
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link:
  query: "@*"
  sort_by: year
  order: descending
