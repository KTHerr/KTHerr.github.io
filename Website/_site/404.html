<script>
  (function () {
    var toggle = document.getElementById('navToggle');
    var links = document.getElementById('navLinks');
    if (!toggle || !links) return;
    toggle.addEventListener('click', function () {
      var open = links.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
    });
  })();

  /* Theme toggle. With no stored choice the page follows the OS setting; one
     click pins the opposite of whatever is showing, and the choice is
     remembered. The head script applies it before first paint. */
  (function () {
    var btn = document.getElementById('themeToggle');
    if (!btn) return;
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var current = function () {
      return document.documentElement.getAttribute('data-theme') || (mq.matches ? 'dark' : 'light');
    };
    var label = function () {
      btn.setAttribute('aria-label', current() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    };
    label();
    btn.addEventListener('click', function () {
      var next = current() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      label();
    });
    if (mq.addEventListener) { mq.addEventListener('change', label); }
  })();
</script>

<script>
  /* Assemble the email address in the browser. The served HTML holds only the
     reversed local part and the reversed domain, in separate attributes, so it
     never contains anything matching user@host for a harvester to lift. */
  (function () {
    var rev = function (s) { return s.split('').reverse().join(''); };
    var at = String.fromCharCode(64);
    var links = document.querySelectorAll('a.js-eml');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      var u = a.getAttribute('data-u');
      var d = a.getAttribute('data-d');
      if (!u || !d) continue;
      var addr = rev(u) + at + rev(d);
      a.setAttribute('href', 'mail' + 'to:' + addr);
      a.removeAttribute('data-u');
      a.removeAttribute('data-d');
      a.removeAttribute('rel');
      if (a.getAttribute('data-show')) {
        var slot = a.querySelector('.eml-text');
        if (slot) { slot.textContent = addr; }
        a.removeAttribute('data-show');
      }
    }
  })();
</script>
