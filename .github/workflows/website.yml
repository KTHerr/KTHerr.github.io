name: Build and deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GITHUB_TOKEN permissions needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs are skipped rather than cancelled, so a
# production deploy already in flight is always allowed to finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The bibliography parser reads the .bib file byte by byte and needs a
      # UTF-8 locale to handle accented author names (Chávez). Without this it
      # fails with "invalid byte sequence in US-ASCII".
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: Website
          ruby-version: '3.3'
          bundler-cache: true   # bundle install + cache the installed gems
          cache-version: 1      # bump to force a clean gem download

      - name: Build site
        working-directory: Website
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
